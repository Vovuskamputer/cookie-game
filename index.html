<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍪 Cookie Empire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #4a4a4a;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #e0e0e0;
        }
        
        h1 {
            text-align: center;
            color: #5d4037;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .play-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            background: linear-gradient(to right, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .play-btn:hover {
            background: linear-gradient(to right, #388E3C, #1B5E20);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 Cookie Empire</h1>
        <p style="text-align: center; font-size: 1.2em; color: #5d4037; margin-bottom: 30px;">
            Кликер игра! Собирай печеньки, покупай улучшения, зарабатывай престиж!
        </p>
        
        <a href="game.html" class="play-btn">🎮 НАЧАТЬ ИГРУ</a>
        
        <div class="info">
            <h3>📱 Как играть в Telegram:</h3>
            <p>1. Создай бота через @BotFather</p>
            <p>2. Залей код бота на Glitch.com</p>
            <p>3. Отправляй игрокам ссылку на эту страницу</p>
        </div>
    </div>
</body>
</html>
