<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍪 Cookie Empire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .cookie-container {
            text-align: center;
            margin: 30px 0;
        }
        
        .cookie {
            width: 200px;
            height: 200px;
            background: #D2691E;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            font-size: 100px;
            line-height: 200px;
            color: white;
            user-select: none;
            transition: transform 0.1s;
            box-shadow: 0 10px 20px rgba(139,69,19,0.3);
        }
        
        .cookie:active {
            transform: scale(0.95);
        }
        
        .cookie:hover {
            transform: scale(1.05);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            min-width: 180px;
            text-align: center;
            border: 2px solid #e9ecef;
        }
        
        .stat-value {
            font-size: 2em;
            color: #28a745;
            font-weight: bold;
        }
        
        .stat-label {
            color: #6c757d;
            margin-top: 10px;
        }
        
        .shop {
            margin-top: 40px;
        }
        
        .shop h2 {
            color: #8B4513;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .shop-item {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .shop-item button:hover {
            background: #218838;
        }
        
        .shop-item button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .upgrade-info h3 {
            margin-bottom: 5px;
            color: #495057;
        }
        
        .upgrade-info p {
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .price {
            font-weight: bold;
            color: #dc3545;
            margin-right: 15px;
        }
        
        .count {
            color: #007bff;
            font-weight: bold;
        }
        
        .click-effect {
            position: absolute;
            color: #ff9800;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.3); }
        }
        
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .menu button {
            padding: 10px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .menu button:hover {
            background: #0056b3;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }
        
        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            cursor: pointer;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .cookie {
                width: 150px;
                height: 150px;
                font-size: 70px;
                line-height: 150px;
            }
            
            .stat-box {
                min-width: 140px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 Cookie Empire</h1>
        
        <div class="cookie-container">
            <div class="cookie" id="cookie">🍪</div>
            <h2 id="cookieCounter">0 печенек</h2>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="cpsValue">0</div>
                <div class="stat-label">Печенек/сек</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="cpcValue">1</div>
                <div class="stat-label">За клик</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="prestigeValue">0</div>
                <div class="stat-label">Престиж</div>
            </div>
        </div>
        
        <div class="shop">
            <h2>🛒 Магазин улучшений</h2>
            <div id="shopItems"></div>
        </div>
        
        <div class="menu">
            <button onclick="openModal('prestigeModal')">⭐ Престиж</button>
            <button onclick="openModal('statsModal')">📊 Статистика</button>
            <button onclick="saveGame()">💾 Сохранить</button>
        </div>
    </div>
    
    <!-- Модальное окно престижа -->
    <div class="modal" id="prestigeModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('prestigeModal')">&times;</span>
            <h2>⭐ Система престижа</h2>
            <p>Престиж сбрасывает прогресс, но дает постоянные бонусы!</p>
            <p>Требуется: <span id="prestigeReq">10,000</span> печенек</p>
            <p>Прогресс: <span id="prestigeProgress">0%</span></p>
            <button id="prestigeButton" style="width:100%;padding:15px;margin-top:20px;" disabled>Недостаточно печенек</button>
        </div>
    </div>
    
    <!-- Модальное окно статистики -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('statsModal')">&times;</span>
            <h2>📊 Статистика</h2>
            <p>Всего кликов: <span id="totalClicks">0</span></p>
            <p>Всего печенек: <span id="totalCookies">0</span></p>
            <p>Время игры: <span id="playTime">0:00</span></p>
            <p>Улучшений куплено: <span id="totalUpgrades">0</span></p>
        </div>
    </div>
    
    <script>
        // =========== ПЕРЕМЕННЫЕ ИГРЫ ===========
        let cookies = 0;
        let cookiesPerSecond = 0;
        let cookiesPerClick = 1;
        let totalClicks = 0;
        let totalCookiesEver = 0;
        let playTime = 0;
        let prestige = 0;
        let prestigeBonus = 1.0;
        
        // Магазин улучшений
        const upgrades = [
            { id: 1, name: "Курсор", desc: "+0.1 печеньки/сек", baseCost: 10, cps: 0.1, count: 0 },
            { id: 2, name: "Бабушка", desc: "+0.5 печеньки/сек", baseCost: 50, cps: 0.5, count: 0 },
            { id: 3, name: "Ферма", desc: "+2 печеньки/сек", baseCost: 200, cps: 2, count: 0 },
            { id: 4, name: "Завод", desc: "+10 печенек/сек", baseCost: 1000, cps: 10, count: 0 },
            { id: 5, name: "Усилитель клика", desc: "+1 к клику", baseCost: 100, cpc: 1, count: 0 }
        ];
        
        // =========== ЭЛЕМЕНТЫ DOM ===========
        const cookie = document.getElementById('cookie');
        const cookieCounter = document.getElementById('cookieCounter');
        const cpsValue = document.getElementById('cpsValue');
        const cpcValue = document.getElementById('cpcValue');
        const prestigeValue = document.getElementById('prestigeValue');
        const shopItems = document.getElementById('shopItems');
        const prestigeButton = document.getElementById('prestigeButton');
        const prestigeReq = document.getElementById('prestigeReq');
        const prestigeProgress = document.getElementById('prestigeProgress');
        const totalClicksStat = document.getElementById('totalClicks');
        const totalCookiesStat = document.getElementById('totalCookies');
        const playTimeStat = document.getElementById('playTime');
        const totalUpgradesStat = document.getElementById('totalUpgrades');
        
        // =========== ЗАГРУЗКА И СОХРАНЕНИЕ ===========
        function saveGame() {
            const gameData = {
                cookies: cookies,
                cookiesPerSecond: cookiesPerSecond,
                cookiesPerClick: cookiesPerClick,
                totalClicks: totalClicks,
                totalCookiesEver: totalCookiesEver,
                playTime: playTime,
                prestige: prestige,
                prestigeBonus: prestigeBonus,
                upgrades: upgrades,
                lastSave: Date.now()
            };
            
            localStorage.setItem('cookieEmpire', JSON.stringify(gameData));
            showNotification('Игра сохранена! 💾');
        }
        
        function loadGame() {
            const saved = localStorage.getItem('cookieEmpire');
            if (!saved) return false;
            
            const data = JSON.parse(saved);
            
            cookies = data.cookies || 0;
            cookiesPerSecond = data.cookiesPerSecond || 0;
            cookiesPerClick = data.cookiesPerClick || 1;
            totalClicks = data.totalClicks || 0;
            totalCookiesEver = data.totalCookiesEver || 0;
            playTime = data.playTime || 0;
            prestige = data.prestige || 0;
            prestigeBonus = data.prestigeBonus || 1.0;
            
            if (data.upgrades) {
                data.upgrades.forEach(savedUpgrade => {
                    const upgrade = upgrades.find(u => u.id === savedUpgrade.id);
                    if (upgrade) {
                        upgrade.count = savedUpgrade.count || 0;
                    }
                });
            }
            
            // Обновляем отображение
            updateDisplay();
            updateShop();
            updatePrestigeDisplay();
            updateStats();
            
            // Офлайн доход
            if (data.lastSave) {
                const timePassed = Date.now() - data.lastSave;
                const secondsPassed = timePassed / 1000;
                const offlineIncome = cookiesPerSecond * secondsPassed * 0.8; // 80% эффективности
                
                if (offlineIncome > 1) {
                    cookies += offlineIncome;
                    totalCookiesEver += offlineIncome;
                    showNotification(`Офлайн доход: +${Math.floor(offlineIncome)} печенек! 🍪`);
                    updateDisplay();
                }
            }
            
            return true;
        }
        
        // =========== ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ ===========
        function updateDisplay() {
            cookieCounter.textContent = `${Math.floor(cookies)} печенек`;
            cpsValue.textContent = cookiesPerSecond.toFixed(1);
            cpcValue.textContent = cookiesPerClick;
            prestigeValue.textContent = prestige;
        }
        
        function updateShop() {
            shopItems.innerHTML = '';
            
            upgrades.forEach(upgrade => {
                const cost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count));
                const canAfford = cookies >= cost;
                
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${upgrade.name} (${upgrade.count})</h3>
                        <p>${upgrade.desc}</p>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="price">${cost} 🍪</span>
                        <button onclick="buyUpgrade(${upgrade.id})" ${!canAfford ? 'disabled' : ''}>
                            ${canAfford ? 'Купить' : 'Не хватает'}
                        </button>
                    </div>
                `;
                shopItems.appendChild(div);
            });
        }
        
        function updatePrestigeDisplay() {
            const required = 10000 * Math.pow(2, prestige);
            const progress = Math.min(100, (totalCookiesEver / required) * 100);
            
            prestigeReq.textContent = Math.floor(required);
            prestigeProgress.textContent = progress.toFixed(1) + '%';
            
            if (totalCookiesEver >= required) {
                prestigeButton.textContent = `ПРЕСТИЖ! (+${prestige + 1} уровень)`;
                prestigeButton.disabled = false;
                prestigeButton.style.background = '#dc3545';
            } else {
                prestigeButton.textContent = 'Недостаточно печенек';
                prestigeButton.disabled = true;
                prestigeButton.style.background = '#6c757d';
            }
        }
        
        function updateStats() {
            totalClicksStat.textContent = totalClicks;
            totalCookiesStat.textContent = Math.floor(totalCookiesEver);
            totalUpgradesStat.textContent = upgrades.reduce((sum, u) => sum + u.count, 0);
            
            const minutes = Math.floor(playTime / 60);
            const seconds = playTime % 60;
            playTimeStat.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // =========== ИГРОВАЯ ЛОГИКА ===========
        function buyUpgrade(id) {
            const upgrade = upgrades.find(u => u.id === id);
            if (!upgrade) return;
            
            const cost = Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count));
            
            if (cookies >= cost) {
                cookies -= cost;
                upgrade.count++;
                
                if (upgrade.cps) {
                    cookiesPerSecond += upgrade.cps;
                }
                if (upgrade.cpc) {
                    cookiesPerClick += upgrade.cpc;
                }
                
                updateDisplay();
                updateShop();
                updateStats();
                saveGame();
                
                showNotification(`Куплено: ${upgrade.name}! 🛒`);
            }
        }
        
        function doPrestige() {
            const required = 10000 * Math.pow(2, prestige);
            
            if (totalCookiesEver >= required) {
                prestige++;
                prestigeBonus = 1 + (prestige * 0.5); // +50% за уровень престижа
                
                // Сброс прогресса
                cookies = 100; // Стартовый бонус
                cookiesPerSecond = 0;
                cookiesPerClick = 1 * prestigeBonus;
                
                upgrades.forEach(u => u.count = 0);
                
                updateDisplay();
                updateShop();
                updatePrestigeDisplay();
                updateStats();
                saveGame();
                
                showNotification(`Престиж ${prestige}! Бонус: +${((prestigeBonus-1)*100).toFixed(0)}% 🎉`);
            }
        }
        
        // =========== КЛИК ПО ПЕЧЕНЬКЕ ===========
        cookie.addEventListener('click', function(e) {
            const rect = cookie.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            cookies += cookiesPerClick * prestigeBonus;
            totalClicks++;
            totalCookiesEver += cookiesPerClick * prestigeBonus;
            
            // Эффект клика
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = `+${(cookiesPerClick * prestigeBonus).toFixed(1)}`;
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            cookie.appendChild(effect);
            
            setTimeout(() => effect.remove(), 1000);
            
            updateDisplay();
            updateStats();
        });
        
        // =========== ИГРОВОЙ ЦИКЛ ===========
        function gameLoop() {
            cookies += cookiesPerSecond / 60; // 60 раз в секунду
            totalCookiesEver += cookiesPerSecond / 60;
            updateDisplay();
        }
        
        function timeLoop() {
            playTime++;
            updateStats();
        }
        
        // =========== УВЕДОМЛЕНИЯ ===========
        function showNotification(text) {
            // Простое уведомление
            console.log(text);
            if (typeof alert !== 'undefined') {
                alert(text);
            }
        }
        
        // =========== МОДАЛЬНЫЕ ОКНА ===========
        function openModal(id) {
            if (id === 'prestigeModal') updatePrestigeDisplay();
            if (id === 'statsModal') updateStats();
            
            document.getElementById(id).style.display = 'block';
        }
        
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
        
        // =========== ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА ПО КЛИКУ ВНЕ ===========
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
        
        // =========== ИНИЦИАЛИЗАЦИЯ ===========
        function init() {
            loadGame();
            
            // Запускаем игровые циклы
            setInterval(gameLoop, 1000/60); // 60 FPS
            setInterval(timeLoop, 1000);
            setInterval(saveGame, 30000); // Автосохранение каждые 30 секунд
            
            updateDisplay();
            updateShop();
            updatePrestigeDisplay();
            updateStats();
            
            // Назначаем обработчик престижа
            prestigeButton.onclick = doPrestige;
            
            // Определяем игрока из URL
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('player') || 'anonymous';
            const playerName = urlParams.get('name') || 'Игрок';
            
            console.log(`Игрок: ${playerName} (${playerId})`);
            if (playerId !== 'anonymous') {
                showNotification(`Привет, ${playerName}! 🍪`);
            }
        }
        
        // Запускаем игру при загрузке страницы
        window.onload = init;
        
        // Сохраняем при закрытии
        window.addEventListener('beforeunload', saveGame);
    </script>
</body>
</html>
